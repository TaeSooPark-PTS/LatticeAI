# Lattice AI Rust workspace — the Rust Foundation (v11.4.0, Phase 1 of
# docs/v11.4.0_RUST_FOUNDATION_PLAN.md). Deliberately independent of
# src-tauri so CI can build and test these crates on a bare ubuntu runner;
# src-tauri consumes lattice-host through a path dependency instead.
[workspace]
resolver = "2"
members = ["lattice-core", "lattice-retrieval", "lattice-host", "lattice-ingest", "lattice-jobs", "lattice-agent", "lattice-auth", "lattice-platform", "lattice-chat"]

[workspace.package]
# Kept in lockstep with the product version by scripts/bump_version.py and
# guarded by tests/unit/test_version_consistency.py.
version = "11.8.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lattice-core = { path = "lattice-core" }
lattice-retrieval = { path = "lattice-retrieval" }
# Phase 2-4 crates. `lattice-host` mounts each one's router factory ahead of
# the reverse-proxy fallthrough; nothing here depends on `lattice-host`, so the
# dependency graph stays a tree (host → {core, retrieval, ingest, jobs, agent}).
lattice-ingest = { path = "lattice-ingest" }
lattice-jobs = { path = "lattice-jobs" }
lattice-agent = { path = "lattice-agent" }
# One Door (v11.6.0) crates: native identity, platform routes, chat
# orchestration. Mounted by lattice-host like the Phase 2-4 crates.
lattice-auth = { path = "lattice-auth" }
lattice-platform = { path = "lattice-platform" }
lattice-chat = { path = "lattice-chat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Storage / retrieval. FTS5 must be verifiably available — lattice-core
# carries a unit test that creates a trigram fts5 table and fails loudly if
# the bundled build lacks the module.
rusqlite = { version = "0.32", features = ["bundled"] }
# Host / gateway.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "io-util", "sync"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
libc = "0.2"
# Phase 2-4 additions: file watching for lattice-ingest.
notify = "6"
walkdir = "2"
# Agent loop (v11.5.1): Python-compatible regex (lookbehind), approval-token
# hashing/encoding, and the SSE stream wrapper for the live step timeline.
fancy-regex = "0.14"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
futures-core = "0.3"

# Test-only conveniences.
tempfile = "3"
