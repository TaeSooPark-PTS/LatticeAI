[package]
name = "lattice-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
lattice-core = { workspace = true }
lattice-auth = { path = "../lattice-auth" }
lattice-agent = { workspace = true }
tower-http = { version = "0.5", features = ["fs"] }
# WP-I4 (static/UI): the invite gate's cookie is an HMAC-SHA256 over an expiry
# and a `secrets.token_urlsafe` nonce, verbatim from `api/static_routes.py`.
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
# WP-R2: Python-compatible lookbehind for audit sensitivity + secret redaction.
fancy-regex = { workspace = true }
# WP-R9: device identity / peer pairing (Ed25519, same raw 32-byte keys as
# lattice_brain.graph.identity) and ZIP backups of knowledge_graph.sqlite.
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# WP-R1: `datetime.now()` is naive *local* time, and there is no timezone crate
# in this workspace — `localtime_r(3)` is how lattice-retrieval already answers
# the same question (`routes/mod.rs::naive_local_now`).
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json"] }
