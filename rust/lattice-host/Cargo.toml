[package]
name = "lattice-host"
version.workspace = true
edition.workspace = true
license.workspace = true

# Library first: the supervisor and the gateway are consumed by `src-tauri`
# as a path dependency. The binary below is a thin opt-in front door.
[lib]
name = "lattice_host"
path = "src/lib.rs"

[[bin]]
name = "lattice-host"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
# The native lanes: the gateway answers them itself out of the read-only store
# instead of proxying them to the Python worker.
lattice-core = { workspace = true }
lattice-retrieval = { workspace = true }
# Mounted router factories (v11.5.0): ingestion dry runs, the background jobs
# scheduler, and the agent safety kernel.
lattice-ingest = { workspace = true }
lattice-jobs = { workspace = true }
lattice-agent = { workspace = true }
# One Door (v11.6.0): native identity, platform routes, chat orchestration.
lattice-auth = { workspace = true }
lattice-platform = { workspace = true }
lattice-chat = { workspace = true }
# Only for kill(2)/SIGTERM on unix; every other platform falls back to the
# std `Child::kill` path.
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
