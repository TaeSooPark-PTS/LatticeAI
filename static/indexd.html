<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect AI — All-in-One Multimodal Workspace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --sidebar-bg: #16191f;
            --accent-blue: #378ADD;
            --accent-glow: rgba(55, 138, 221, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main);
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- 사이드바 --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #378ADD, #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .history-item {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .history-item:hover {
            background: var(--glass-bg);
            color: var(--text-main);
        }

        /* --- 메인 채팅창 --- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1a1d24, #0f1115);
        }

        .chat-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .model-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .messages-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20%;
            scroll-behavior: smooth;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            width: 100%; /* 부모 너비 전체 사용 */
        }

        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }

        .bubble {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.6;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            word-wrap: break-word;
            overflow-wrap: break-word; /* 강력한 단어 끊기 */
            word-break: break-word;
            max-width: 90%; 
        }

        /* 마크다운 스타일 */
        .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px 0; color: var(--accent-blue); }
        .bubble p { margin-bottom: 8px; }
        .bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
        .bubble code:not(pre code) { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; }

        .user .bubble {
            background: linear-gradient(135deg, #378ADD, #215d96);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: var(--glass-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        /* 코드 블록 스크롤 및 자동 줄바꿈 방지 */
        .code-container {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            border-radius: 8px;
            margin: 12px 0;
            background: #1e1e1e;
        }

        pre {
            width: 100%;
            overflow-x: auto;
            white-space: pre; /* 코드는 원본 유지하되 가로 스크롤 */
            padding: 15px;
            font-size: 13px;
            background: #1e1e1e;
            scrollbar-width: thin;
        }

        /* 다운로드 버튼 전용 스타일 */
        .download-btn-ui {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .download-btn-ui:hover {
            background: #2a6dbd;
            transform: translateY(-1px);
        }

        .img-attachment {
            max-width: 300px;
            border-radius: 12px;
            margin-top: 8px;
            border: 2px solid var(--border-color);
        }

        /* --- 입력창 --- */
        .input-area {
            padding: 24px 20%;
            background: transparent;
        }

        .input-box {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--accent-blue);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            max-height: 200px;
            outline: none;
            padding: 8px 0;
            font-family: inherit;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .action-btn:hover {
            color: var(--text-main);
            background: var(--glass-bg);
        }

        .send-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover { transform: scale(1.05); }

        .preview-bar {
            display: flex;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .preview-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            position: relative;
        }

        .remove-preview {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    </style>
</head>
<body>
    <div id="auth-overlay" style="position: fixed; inset: 0; background: var(--bg-dark); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
        <div class="input-box" style="width: 400px; padding: 40px; border-radius: 24px; gap: 20px;">
            <div id="login-form">
                <h2 style="margin-bottom: 24px; text-align: center;">Welcome Back</h2>
                <input type="email" id="login-email" placeholder="이메일 (ID)" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px; outline: none;">
                <input type="password" id="login-pw" placeholder="비밀번호" style="width: 100%; padding: 12px; margin-bottom: 24px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px; outline: none;">
                <button onclick="handleLogin()" style="width: 100%; padding: 14px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">로그인</button>
                <p style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">계정이 없으신가요? <a href="#" onclick="toggleAuth(true)" style="color: var(--accent-blue);">회원가입</a></p>
            </div>
            <div id="register-form" style="display: none;">
                <h2 style="margin-bottom: 24px; text-align: center;">Create Account</h2>
                <input type="email" id="reg-email" placeholder="이메일 주소" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px;">
                <input type="password" id="reg-pw" placeholder="비밀번호" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px;">
                <input type="text" id="reg-name" placeholder="이름" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px;">
                <input type="text" id="reg-nickname" placeholder="별명" style="width: 100%; padding: 12px; margin-bottom: 24px; background: var(--glass-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px;">
                <button onclick="handleRegister()" style="width: 100%; padding: 14px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">가입하기</button>
                <p style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">이미 계정이 있나요? <a href="#" onclick="toggleAuth(false)" style="color: var(--accent-blue);">로그인</a></p>
            </div>
        </div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i class="ti ti-brain"></i></div>
                <h2 style="font-size: 16px; font-weight: 600;">Connect AI</h2>
            </div>
            <div style="padding: 16px; font-size: 12px; color: var(--accent-blue); border-bottom: 1px solid var(--border-color);">
                <i class="ti ti-user-circle"></i> <span id="user-nickname-display">Guest</span>님 환영합니다
            </div>
            <div class="history-container" id="history-container">
                <!-- History items -->
            </div>
            <div style="padding: 24px;">
                <button id="new-chat-btn" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--glass-bg); border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer;">＋ New Chat</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <header class="chat-header">
                <div class="model-badge">
                    <div class="status-dot"></div>
                    <span>Gemma-4 Multimodal Agent</span>
                </div>
                <button onclick="logout()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px;">로그아웃</button>
            </header>

            <div class="messages-viewport" id="chat-viewport">
                <!-- Messages -->
            </div>

            <div class="input-area">
                <div class="input-box">
                    <div id="preview-area" class="preview-bar" style="display: none;">
                        <div style="position: relative;">
                            <img id="img-preview" class="preview-thumb" src="">
                            <div class="remove-preview" onclick="removeImage()">×</div>
                        </div>
                    </div>
                    <div class="input-row">
                        <label class="action-btn">
                            <i class="ti ti-camera" style="font-size: 20px;"></i>
                            <input type="file" id="image-input" accept="image/*" hidden onchange="previewImage(this)">
                        </label>
                        <textarea id="user-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                        <button class="send-btn" id="send-btn"><i class="ti ti-send"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const chatViewport = document.getElementById('chat-viewport');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const historyContainer = document.getElementById('history-container');
        let currentImageData = null;
        let currentUserNickname = "Guest";

        // --- VS Code Extension Bridge ---
        let vscode = null;
        try {
            if (typeof acquireVsCodeApi === 'function') {
                vscode = acquireVsCodeApi();
                console.log("🚀 VS Code API Acquired");
                document.getElementById('auth-overlay').style.display = 'none'; // VS Code에서는 로그인 건너뜀
            }
        } catch (e) { /* Not in VS Code */ }

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'prefill') {
                userInput.value = message.text;
                userInput.focus();
            }
        });

        function toggleAuth(showRegister) {
            document.getElementById('login-form').style.display = showRegister ? 'none' : 'block';
            document.getElementById('register-form').style.display = showRegister ? 'block' : 'none';
        }

        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pw').value;
            const name = document.getElementById('reg-name').value;
            const nickname = document.getElementById('reg-nickname').value;
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name, nickname })
            });
            if (res.ok) { alert("가입 완료! 로그인 해주세요."); toggleAuth(false); }
            else { alert("가입 실패: " + (await res.json()).detail); }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pw').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                const data = await res.json();
                currentUserNickname = data.nickname;
                document.getElementById('user-nickname-display').innerText = currentUserNickname;
                document.getElementById('auth-overlay').style.display = 'none';
                addMessage('ai', `반갑습니다, <b>${currentUserNickname}</b>님!`);
            } else { alert("로그인 실패!"); }
        }

        function logout() { location.reload(); }

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('preview-area').style.display = 'flex';
                    currentImageData = e.target.result.split(',')[1];
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage() {
            document.getElementById('image-input').value = "";
            document.getElementById('preview-area').style.display = 'none';
            currentImageData = null;
        }

        // 코드 데이터를 안전하게 보관할 저장소
        const codeRegistry = {};
        let codeCounter = 0;

        // Marked.js 설정: 코드 블록에 다운로드 버튼 추가
        const renderer = new marked.Renderer();
        renderer.code = function(code, lang) {
            const rawCode = typeof code === 'object' ? code.text : code;
            const codeId = `code-ref-${codeCounter++}`;
            codeRegistry[codeId] = rawCode; // 저장소에 보관

            const fileName = lang ? `code.${lang}` : 'script.txt';

            return `
                <div class="code-container">
                    <div style="background:#1e1e1e; color:#858585; font-size:10px; padding:6px 12px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
                        <span style="text-transform:uppercase; letter-spacing:1px; font-weight:bold;">${lang || 'text'}</span>
                        <button onclick="downloadCode('${codeId}', '${fileName}')" class="download-btn-ui">
                            <i class="ti ti-download" style="font-size:12px;"></i> Download
                        </button>
                    </div>
                    <pre><code>${rawCode}</code></pre>
                </div>
            `;
        };
        marked.setOptions({ renderer, breaks: true });

        // 수리된 다운로드 함수
        function downloadCode(codeId, fileName) {
            const code = codeRegistry[codeId];
            if (!code) return;

            // 1. VS Code 환경인 경우 확장 프로그램으로 전달
            if (vscode) {
                vscode.postMessage({
                    type: 'download',
                    fileName: fileName,
                    content: code
                });
                return;
            }

            // 2. 일반 브라우저 환경
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a); // 반드시 추가되어야 함
            a.click(); // 실제 클릭 발생
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function addMessage(role, text, imageData = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const senderName = role === 'user' ? currentUserNickname : "Connect AI";
            
            let formattedContent = "";
            if (role === 'ai') {
                formattedContent = marked.parse(text);
            } else {
                formattedContent = text.replace(/\n/g, '<br>');
            }

            let content = `
                <div style="font-size: 11px; margin-bottom: 4px; color: var(--text-muted);">${senderName}</div>
                <div class="bubble">${formattedContent}</div>
            `;
            if (imageData && role === 'user') {
                content = `<img src="data:image/png;base64,${imageData}" class="img-attachment">` + content;
            }
            msgDiv.innerHTML = content;
            chatViewport.appendChild(msgDiv);
            chatViewport.scrollTop = chatViewport.scrollHeight;
        }

        async function loadHistory() {
            try {
                const res = await fetch('/history');
                const history = await res.json();
                historyContainer.innerHTML = history.reverse().map(h => `
                    <div class="history-item"><i class="ti ti-message-2"></i> ${h.content.substring(0, 15)}...</div>
                `).join('');
            } catch (e) {}
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !currentImageData) return;
            addMessage('user', text, currentImageData);
            const capturedImage = currentImageData;
            userInput.value = ''; removeImage();

            if (vscode) {
                vscode.postMessage({ type: 'send', text: text, image_data: capturedImage });
                return;
            }

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `<div class="bubble">...</div>`;
            chatViewport.appendChild(aiMsgDiv);

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, image_data: capturedImage, stream: false })
            });
            const data = await res.json();
            // AI 답변 렌더링 시 addMessage와 동일한 로직 적용을 위해 내부 내용 교체
            chatViewport.removeChild(aiMsgDiv);
            addMessage('ai', data.response);
            loadHistory();
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
        document.getElementById('new-chat-btn').onclick = () => location.reload();
        loadHistory();
    </script>
</body>
</html>
