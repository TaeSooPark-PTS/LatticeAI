<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lattice AI · Local-First Workspace</title>

  <!-- Pre-paint theme to avoid a flash (mirrors data-lt-theme from storage). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lt-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-lt-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <!-- Color single-source (shared with the rest of Lattice AI) -->
  <link rel="stylesheet" href="/static/css/tokens.css?v=3.0.0">
  <!-- v3 design system (token-native, no legacy override layers) -->
  <link rel="stylesheet" href="/static/v3/css/lattice.tokens.css?v=3.0.0">
  <link rel="stylesheet" href="/static/v3/css/lattice.base.css?v=3.0.0">
  <link rel="stylesheet" href="/static/v3/css/lattice.components.css?v=3.0.0">
  <link rel="stylesheet" href="/static/v3/css/lattice.shell.css?v=3.0.0">
  <link rel="stylesheet" href="/static/v3/css/lattice.views.css?v=3.0.0">
</head>
<body>
  <div id="app"></div>
  <noscript style="display:block;padding:2rem;font-family:system-ui">Lattice AI requires JavaScript to run the workspace shell.</noscript>
  <script type="module" src="/static/v3/js/app.js?v=3.0.0"></script>
</body>
</html>
