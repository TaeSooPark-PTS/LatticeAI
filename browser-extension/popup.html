<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send to Lattice AI</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.4 -apple-system, system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.sub { margin: 0 0 12px; color: #888; font-size: 11px; }
    label { display: block; font-size: 11px; color: #888; margin: 8px 0 3px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #5557; border-radius: 6px; background: transparent; color: inherit; }
    button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #16a34a; } .err { color: #dc2626; }
    .local { margin-top: 12px; font-size: 10px; color: #999; }
  </style>
</head>
<body>
  <h1>Send page to Lattice AI</h1>
  <p class="sub">Adds this page to your local Knowledge Graph.</p>
  <label for="port">Local runtime port</label>
  <input id="port" type="number" value="4825" min="1" max="65535" />
  <button id="send">Send this page</button>
  <div id="status" class="status"></div>
  <div class="local">Local-only — posts to http://127.0.0.1 on your machine. No cloud upload.</div>
  <script src="popup.js"></script>
</body>
</html>
