name: Postgres Integration (live)

# Exercises the SQLite -> Postgres/pgvector migration integrity test that is
# SKIPPED everywhere by default. The suite
# (tests/integration/test_postgres_migration_live.py) is gated behind
# LTCAI_LIVE_POSTGRES_DOCKER_CONSENT=1 because it starts a real database via
# lattice_brain.storage.DockerPostgresWizard (image: pgvector/pgvector:pg16)
# using `docker compose`, which is preinstalled on GitHub-hosted ubuntu
# runners. The test brings the container up and tears it down itself, so no
# GitHub `services:` block is needed (and would be ignored by the wizard).
#
# This job is deliberately NOT wired into the PR path: it is slow, pulls an
# image, and needs Docker. It runs on a weekly schedule and on demand.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  postgres-live:
    name: Live SQLite -> Postgres/pgvector migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Preflight — Docker + compose available
        run: |
          docker --version
          docker compose version

      - name: Install project + Postgres extra + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]" pytest pytest-asyncio httpx

      - name: Run live Postgres migration integration test
        env:
          # Explicit consent flips the pytest skip marker in the suite.
          LTCAI_LIVE_POSTGRES_DOCKER_CONSENT: "1"
        run: |
          python -m pytest tests/integration/test_postgres_migration_live.py -v --tb=short

      - name: Collect Docker logs on failure
        if: failure()
        run: docker ps -a && docker compose ls || true
