name: Postgres Integration (live)

# The live SQLite -> Postgres/pgvector suite used to start a pgvector
# container via lattice_brain.storage.DockerPostgresWizard. That writer
# left in v11.6.0 with the rest of the Python product write path; SQLite
# is the live Brain store. The job still runs so a Monday cron is not a
# missing-file failure. The suite now skip-explains the retirement.
#
# This job is deliberately NOT wired into the PR path.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  postgres-live:
    name: Live SQLite -> Postgres/pgvector migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Preflight — Docker + compose available
        run: |
          docker --version
          docker compose version

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "." pytest pytest-asyncio httpx

      - name: Run live Postgres migration integration test
        env:
          # Explicit consent flips the pytest skip marker in the suite.
          LTCAI_LIVE_POSTGRES_DOCKER_CONSENT: "1"
        run: |
          python -m pytest tests/integration/test_postgres_migration_live.py -v --tb=short

      - name: Collect Docker logs on failure
        if: failure()
        run: docker ps -a && docker compose ls || true
