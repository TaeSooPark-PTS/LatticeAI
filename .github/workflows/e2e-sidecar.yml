name: Sidecar E2E (nightly)

# Wave 3.2 residual — real FastAPI sidecar + Playwright first-value loop.
# Mock-server visual smoke stays in visual.yml; this job is the live path.

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-sidecar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sidecar-e2e:
    name: Playwright first-value (live sidecar)
    # Playwright's Chromium installer does not yet support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      # The runner builds `lattice-host` from this checkout (One Door: the
      # front door is the binary, not `uvicorn server:app`). Without this a
      # cold cargo build burns 5–10 minutes of every nightly run.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Install Ubuntu 24.04 / 26.04 (t64) system libraries
        # Ensure Chromium & Tauri system libraries install cleanly across both
        # Ubuntu 24.04 and upcoming Ubuntu 26.04 (`ubuntu-latest` / `ubuntu-26.04`).
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2 || true
          sudo apt-get install -y --no-install-recommends libatk1.0-0t64 || sudo apt-get install -y --no-install-recommends libatk1.0-0 || true
          sudo apt-get install -y --no-install-recommends libatk-bridge2.0-0t64 || sudo apt-get install -y --no-install-recommends libatk-bridge2.0-0 || true
          sudo apt-get install -y --no-install-recommends libcups2t64 || sudo apt-get install -y --no-install-recommends libcups2 || true
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 || sudo apt-get install -y --no-install-recommends libgtk-3-0 || true
          sudo apt-get install -y --no-install-recommends libgbm1 libnss3 libxkbcommon0 libayatana-appindicator3-1 || true
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 || sudo apt-get install -y --no-install-recommends webkit2gtk-4.1 || true

      - name: Install dependencies
        run: |
          pip install -e "."
          npm ci
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Verify Ubuntu 24.04 / 26.04 Chromium shared libraries
        run: node scripts/check_ubuntu_runner_compat.mjs --diagnostic --verify-chromium

      - name: Build frontend assets
        run: npm run build:assets

      - name: Run sidecar E2E
        run: npm run test:e2e:sidecar

      - name: Upload E2E failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-e2e-report
          path: |
            test-results/
            playwright-report/
