name: Release

# Publish to npm, PyPI, VS Code Marketplace, Open VSX when a v* tag is pushed.
# Required repository secrets:
#   NPM_TOKEN       — `npm token create` (Automation token, public scope)
#   PYPI_TOKEN      — PyPI API token (scope: ltcai)
#   VSCE_PAT        — Azure DevOps PAT with Marketplace publish rights
#   OVSX_TOKEN      — Open VSX access token

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Python build tools
        run: pip install --upgrade build twine

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Validate Python distribution
        run: twine check dist/*

      - name: Pack npm tarball
        run: npm pack

      - name: Install vsce + ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          vsce package --no-yarn -o "../dist/ltcai-${{ steps.meta.outputs.version }}.vsix"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            ltcai-*.tgz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install --upgrade twine
          twine upload ./artifacts/*.whl ./artifacts/*.tar.gz

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @vscode/vsce
      - working-directory: vscode-extension
        run: |
          npm ci || npm install
          vsce publish --no-yarn -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-ovsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.OVSX_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g ovsx @vscode/vsce
      - working-directory: vscode-extension
        run: |
          npm ci || npm install
          vsce package --no-yarn -o "../dist/ltcai.vsix"
          ovsx publish "../dist/ltcai.vsix" -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

  release-notes:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.vsix
            artifacts/*.tgz
