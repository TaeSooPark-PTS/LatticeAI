name: Release

# Runs on semantic release tag pushes, with or without a leading v. Builds and
# validates all release artifacts only.
# Package-store publication is intentionally manual so pushing a tag can never
# publish to PyPI / npm / VS Code Marketplace / Open VSX by accident.
#
# Local publish commands below must use exact version filenames. Never publish
# with a broad dist/* glob.
#
# Lint, typecheck, docs:check-links, frontend tests, and unit pytest already
# ran on this commit in ci.yml. This workflow does not repeat them.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GitHub is migrating JS actions to Node.js 24 (Node 20 removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and validate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          pip install --upgrade build twine
          pip install "."
          pip install pytest pytest-asyncio httpx ruff "mypy>=1.14,<2"

      - name: Install Node dependencies
        run: |
          npm ci
          (cd vscode-extension && npm ci)

      - name: Release readiness gates
        run: |
          npm run docs:check-current
          npm run build:assets
          python scripts/product_readiness.py

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Installed-wheel smoke test (fresh venv, non-repo cwd)
        run: python scripts/wheel_smoke.py --wheel "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl"

      - name: Validate Python distribution
        # Explicit filenames — more reliable than a glob on all shells/CI runners.
        run: |
          twine check \
            "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl" \
            "dist/ltcai-${{ steps.meta.outputs.version }}.tar.gz"

      - name: Pack npm tarball
        run: npm pack

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          test -f out/extension.js
          vsce package --no-yarn -o "../dist/ltcai-${{ steps.meta.outputs.version }}.vsix"

      - name: Validate release artifacts (version-scoped, no dist/* glob)
        run: |
          python scripts/validate_release_artifacts.py \
            "${{ steps.meta.outputs.version }}" --require-vsix --require-tgz
