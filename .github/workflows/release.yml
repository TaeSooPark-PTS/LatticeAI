name: Release

# Runs on v* tag pushes. Builds all release artifacts, validates them, then
# publishes to PyPI / npm / VS Code Marketplace / Open VSX when the respective
# secrets are present in the repository.
#
# Required secrets (add in Settings → Secrets and variables → Actions):
#   PYPI_TOKEN  — PyPI API token (scope: entire account or project)
#   NPM_TOKEN   — npm access token (Automation type, scope: publish)
#   VSCE_TOKEN  — VS Code Marketplace personal access token (Marketplace → PAT)
#   OVSX_TOKEN  — Open VSX access token (open-vsx.org → User Settings → Tokens)
#
# If a secret is absent the corresponding publish step is skipped automatically.
# Build, validate, and artifact-upload steps always run regardless of secrets.

on:
  push:
    tags:
      - 'v*'

# GitHub is migrating JS actions to Node.js 24 (Node 20 removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and validate artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade build twine
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Validate Python distribution
        # Explicit filenames — more reliable than a glob on all shells/CI runners.
        run: |
          twine check \
            "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl" \
            "dist/ltcai-${{ steps.meta.outputs.version }}.tar.gz"

      - name: Pack npm tarball
        run: npm pack

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          test -f out/extension.js
          vsce package --no-yarn -o "../dist/ltcai-${{ steps.meta.outputs.version }}.vsix"

      - name: Validate release artifacts (version-scoped, no dist/* glob)
        run: |
          python scripts/validate_release_artifacts.py \
            "${{ steps.meta.outputs.version }}" --require-vsix --require-tgz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # Explicit per-version paths only — no `dist/*` glob.
          path: |
            dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl
            dist/ltcai-${{ steps.meta.outputs.version }}.tar.gz
            dist/ltcai-${{ steps.meta.outputs.version }}.vsix
            ltcai-${{ steps.meta.outputs.version }}.tgz

  publish:
    name: Publish release artifacts
    needs: build
    runs-on: ubuntu-latest
    # Download the artifacts produced by the build job so each publish step
    # can reference dist/ without re-running the build.
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      # ── PyPI ──────────────────────────────────────────────────────────────
      - name: Publish to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install --quiet twine
          twine upload \
            "dist/ltcai-${{ needs.build.outputs.version }}-py3-none-any.whl" \
            "dist/ltcai-${{ needs.build.outputs.version }}.tar.gz"

      # ── npm ───────────────────────────────────────────────────────────────
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish "ltcai-${{ needs.build.outputs.version }}.tgz" --access public

      # ── VS Code Marketplace ───────────────────────────────────────────────
      - name: Set up Node for Marketplace publish
        if: ${{ secrets.VSCE_TOKEN != '' || secrets.OVSX_TOKEN != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_TOKEN != '' }}
        run: |
          npm install -g @vscode/vsce
          vsce publish \
            --packagePath "dist/ltcai-${{ needs.build.outputs.version }}.vsix" \
            --pat "${{ secrets.VSCE_TOKEN }}"

      # ── Open VSX ─────────────────────────────────────────────────────────
      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_TOKEN != '' }}
        run: |
          npm install -g ovsx
          ovsx publish \
            "dist/ltcai-${{ needs.build.outputs.version }}.vsix" \
            -p "${{ secrets.OVSX_TOKEN }}"
