name: Release

# Automatically triggers when `CI` (`ci.yml`) completes on `main` (auto-tagging
# & releasing any new unreleased version in package.json, while cleanly
# skipping ordinary already-tagged commits), and also supports manual tag push
# or workflow_dispatch.
#
# Hard-enforces completed green `CI` (`ci.yml` — including Rust, Python matrix,
# Frontend 100% coverage, Integration smoke, Build, and Visual Smoke) on the
# exact commit SHA before building, signing, publishing the GitHub Release, or
# chaining CD (`publish.yml`). If CI failed or never ran on the commit, Release
# and CD are strictly blocked.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

# GitHub is migrating JS actions to Node.js 24 (Node 20 removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-ci:
    name: Enforce CI passed & resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Skip when triggered by non-push or failed CI workflow_run
        id: precheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.event }}" != "push" ] || [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Skipping auto-release: CI run was not a push to main."
              exit 0
            fi
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::CI did not succeed (conclusion=${{ github.event.workflow_run.conclusion }}); Release & CD blocked."
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.precheck.outputs.proceed == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify green CI on exact commit SHA & auto-tag unreleased versions
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.precheck.outputs.proceed }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$(git rev-parse HEAD)"
          OK="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "${OK:-0}" -lt 1 ]; then
            echo "::error::Release & CD blocked: CI (ci.yml) has no completed success run for commit ${SHA}."
            exit 1
          fi
          echo "Verified CI passed on commit ${SHA} (${OK} successful run(s))."

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COMMIT_MSG="$(git log -1 --pretty=%B "${SHA}")"
            if echo "${COMMIT_MSG}" | grep -qiE '\[(skip release|no release)\]'; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Commit ${SHA} includes [skip release] / [no release] — skipping automatic Release & CD."
              exit 0
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
              if gh release view "${TAG}" >/dev/null 2>&1; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "Tag ${TAG} and GitHub Release already exist on origin — ordinary main commit, skipping Release & CD."
                exit 0
              fi
              echo "::notice::Tag ${TAG} exists on origin without a published GitHub Release — resuming Release & CD."
              python3 scripts/bump_version.py "${VERSION}" --check
              node scripts/check_current_release_docs.mjs
              node scripts/check_doc_languages.mjs
            else
              # Guard against accidental partial version bumps: require every manifest
              # (package.json, pyproject.toml, Cargo.toml, tauri.conf.json, VSIX, markers)
              # AND release docs / language gates to match VERSION before auto-tagging.
              python3 scripts/bump_version.py "${VERSION}" --check
              node scripts/check_current_release_docs.mjs
              node scripts/check_doc_languages.mjs
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG}" -m "Lattice AI ${TAG} — Living Synthesis" "${SHA}"
              git push origin "${TAG}"
              echo "Auto-created and pushed tag ${TAG} at CI-verified commit ${SHA}."
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and validate core artifacts
    needs: verify-ci
    if: needs.verify-ci.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: |
          pip install "." --upgrade build twine
          npm ci
          (cd vscode-extension && npm ci)

      - name: Release readiness gates
        run: |
          npm run docs:check-current
          npm run docs:check-languages
          node scripts/check_ubuntu_runner_compat.mjs --diagnostic
          npm run build:assets
          python scripts/product_readiness.py

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Installed-wheel smoke test (fresh venv, non-repo cwd)
        run: python scripts/wheel_smoke.py --wheel "dist/ltcai-${{ needs.verify-ci.outputs.version }}-py3-none-any.whl"

      - name: Validate Python distribution
        run: |
          twine check \
            "dist/ltcai-${{ needs.verify-ci.outputs.version }}-py3-none-any.whl" \
            "dist/ltcai-${{ needs.verify-ci.outputs.version }}.tar.gz"

      - name: Pack npm tarball
        run: npm pack

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm run compile
          test -f out/extension.js
          npx --yes @vscode/vsce package --no-yarn -o "../dist/ltcai-${{ needs.verify-ci.outputs.version }}.vsix"

      - name: Validate release artifacts (version-scoped, no dist/* glob)
        run: |
          python scripts/validate_release_artifacts.py \
            "${{ needs.verify-ci.outputs.version }}" --require-vsix --require-tgz

      - name: Stage exact-version core assets and checksums
        run: |
          V="${{ needs.verify-ci.outputs.version }}"
          mkdir -p release-core-assets
          cp "dist/ltcai-${V}-py3-none-any.whl" \
             "dist/ltcai-${V}.tar.gz" \
             "ltcai-${V}.tgz" \
             "dist/ltcai-${V}.vsix" \
             release-core-assets/
          (
            cd release-core-assets
            sha256sum "ltcai-${V}-py3-none-any.whl" > "ltcai-${V}-py3-none-any.whl.sha256"
            sha256sum "ltcai-${V}.tar.gz" > "ltcai-${V}.tar.gz.sha256"
            sha256sum "ltcai-${V}.tgz" > "ltcai-${V}.tgz.sha256"
            sha256sum "ltcai-${V}.vsix" > "ltcai-${V}.vsix.sha256"
          )

      - name: Upload core release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-core-assets
          path: release-core-assets/
          retention-days: 7

  macos-dmg:
    name: Build & sign macOS Apple Silicon DMG
    needs: verify-ci
    if: needs.verify-ci.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Verify Apple Silicon runner architecture
        run: |
          ARCH="$(uname -m)"
          echo "Runner arch: ${ARCH}"
          test "${ARCH}" = "arm64"

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo registry and Tauri build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust
            src-tauri

      - name: Install dependencies & build frontend assets
        run: |
          pip install "."
          npm ci
          npm run build:assets

      - name: Configure Apple Developer ID signing (when secrets exist)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "${APPLE_CERTIFICATE}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
            CERT_PATH="${RUNNER_TEMP}/developer-cert.p12"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            echo "${APPLE_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
            IDENTITY="${APPLE_SIGNING_IDENTITY_SECRET}"
            if [ -z "${IDENTITY}" ]; then
              IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            fi
            if [ -z "${IDENTITY}" ]; then
              echo "::error::APPLE_CERTIFICATE provided, but no Developer ID Application identity found."
              exit 1
            fi
            echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"
            echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"
            rm -f "${CERT_PATH}"
          else
            echo "signing_mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate secrets configured; falling back to ad-hoc codesign."
          fi

      - name: Build Tauri macOS bundle & DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:tauri:build

      - name: Ensure ad-hoc signature & smoke-verify DMG
        run: |
          V="${{ needs.verify-ci.outputs.version }}"
          APP_PATH="src-tauri/target/release/bundle/macos/Lattice AI.app"
          DMG_PATH="src-tauri/target/release/bundle/dmg/Lattice AI_${V}_aarch64.dmg"
          test -d "${APP_PATH}"
          test -f "${DMG_PATH}"

          if [ "${{ steps.signing.outputs.signing_mode }}" = "ad-hoc" ]; then
            if ! codesign --verify --deep --strict "${APP_PATH}" 2>/dev/null; then
              codesign --force --deep --sign - "${APP_PATH}"
              rm -f "${DMG_PATH}"
              hdiutil create -volname "Lattice AI" -srcfolder "${APP_PATH}" -ov -format UDZO "${DMG_PATH}"
            fi
          fi

          hdiutil verify "${DMG_PATH}"
          MOUNT_DIR="${RUNNER_TEMP}/lattice-dmg-mount"
          mkdir -p "${MOUNT_DIR}"
          hdiutil attach "${DMG_PATH}" -nobrowse -readonly -mountpoint "${MOUNT_DIR}"
          trap 'hdiutil detach "${MOUNT_DIR}" -force || true' EXIT

          MOUNTED_APP="${MOUNT_DIR}/Lattice AI.app"
          test -d "${MOUNTED_APP}"
          codesign --verify --deep --strict --verbose=2 "${MOUNTED_APP}"
          MAIN_BIN="$(find "${MOUNTED_APP}/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)"
          test -n "${MAIN_BIN}"
          file "${MAIN_BIN}" | grep -q "arm64"
          python -c "import scripts.release_smoke as rs; rs.smoke_static_assets('${V}'); rs.smoke_tauri('${V}', launch=False)"

      - name: Stage macOS DMG and checksum
        run: |
          V="${{ needs.verify-ci.outputs.version }}"
          DMG_NAME="Lattice AI_${V}_aarch64.dmg"
          mkdir -p release-macos-assets
          cp "src-tauri/target/release/bundle/dmg/${DMG_NAME}" "release-macos-assets/${DMG_NAME}"
          (
            cd release-macos-assets
            shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256"
          )

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-assets
          path: release-macos-assets/
          retention-days: 7

  github-release:
    name: Publish GitHub Release assets
    needs: [verify-ci, build, macos-dmg]
    if: needs.verify-ci.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Download core release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-core-assets
          path: release-assets

      - name: Download macOS DMG assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-assets
          path: release-assets

      - name: Verify exact assets and build unified SHA256SUMS
        run: |
          V="${{ needs.verify-ci.outputs.version }}"
          cd release-assets
          for f in \
            "ltcai-${V}-py3-none-any.whl" \
            "ltcai-${V}.tar.gz" \
            "ltcai-${V}.tgz" \
            "ltcai-${V}.vsix" \
            "Lattice AI_${V}_aarch64.dmg"; do
            test -f "${f}"
          done
          sha256sum \
            "ltcai-${V}-py3-none-any.whl" \
            "ltcai-${V}.tar.gz" \
            "ltcai-${V}.tgz" \
            "ltcai-${V}.vsix" \
            "Lattice AI_${V}_aarch64.dmg" > "SHA256SUMS-${V}.txt"
          sha256sum -c "SHA256SUMS-${V}.txt"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.verify-ci.outputs.version }}"
          TARGET_TAG="${{ needs.verify-ci.outputs.tag }}"
          if [ -z "$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}")" ]; then
            echo "No tag ${TARGET_TAG} on origin; skipping GitHub Release attachment."
            exit 0
          fi
          NOTES_FILE="docs/releases/RELEASE_NOTES_v${V}.md"
          if ! gh release view "${TARGET_TAG}" >/dev/null 2>&1; then
            if [ -f "${NOTES_FILE}" ]; then
              gh release create "${TARGET_TAG}" --title "Lattice AI v${V}" --notes-file "${NOTES_FILE}"
            else
              gh release create "${TARGET_TAG}" --title "Lattice AI v${V}" --generate-notes
            fi
          fi
          gh release upload "${TARGET_TAG}" --clobber \
            "release-assets/ltcai-${V}-py3-none-any.whl" \
            "release-assets/ltcai-${V}-py3-none-any.whl.sha256" \
            "release-assets/ltcai-${V}.tar.gz" \
            "release-assets/ltcai-${V}.tar.gz.sha256" \
            "release-assets/ltcai-${V}.tgz" \
            "release-assets/ltcai-${V}.tgz.sha256" \
            "release-assets/ltcai-${V}.vsix" \
            "release-assets/ltcai-${V}.vsix.sha256" \
            "release-assets/Lattice AI_${V}_aarch64.dmg" \
            "release-assets/Lattice AI_${V}_aarch64.dmg.sha256" \
            "release-assets/SHA256SUMS-${V}.txt"

  cd:
    name: Chain CD package publication
    needs: [verify-ci, build, github-release]
    if: needs.verify-ci.outputs.should_release == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.verify-ci.outputs.tag }}
    secrets: inherit
