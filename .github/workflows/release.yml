name: Release (build-only)

# Build-only workflow: runs tests and produces release artifacts when a v* tag
# is pushed. It NEVER publishes to npm, PyPI, the VS Code Marketplace, or Open VSX.
# Publishing is done manually from a local machine after authenticating there, so
# no npm/PyPI/Marketplace/Open VSX tokens are stored in GitHub Secrets.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Test and build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade build twine
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        # Integration tests in tests/integration require a live server, so only
        # the unit suite runs here.
        run: python -m pytest tests/unit/ -v

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Validate Python distribution
        run: twine check dist/*

      - name: Pack npm tarball
        run: npm pack

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          test -f out/extension.js
          vsce package --no-yarn -o "../dist/ltcai-${{ steps.meta.outputs.version }}.vsix"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            ltcai-*.tgz
