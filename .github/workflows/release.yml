name: Release (build-only)

# Build-only workflow: runs tests and produces release artifacts when a v* tag
# is pushed. It NEVER publishes to npm, PyPI, the VS Code Marketplace, or Open VSX.
# Publishing is done manually from a local machine after authenticating there, so
# no npm/PyPI/Marketplace/Open VSX tokens are stored in GitHub Secrets.
#
# Artifacts are uploaded for the tagged version ONLY. We never upload `dist/*`
# with a glob: a clean CI checkout regenerates dist/, but the explicit filenames
# keep the policy unambiguous and mirror the local release checklist (RELEASE.md).

on:
  push:
    tags:
      - 'v*'

# GitHub is migrating JS actions to Node.js 24 (Node 20 removed 2026-09-16).
# Opt in now so the build is forward-compatible and free of deprecation noise.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Test and build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade build twine
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        # Integration tests in tests/integration require a live server, so only
        # the unit suite runs here.
        run: python -m pytest tests/unit/ -v

      - name: Build Python sdist + wheel
        run: python -m build

      - name: Validate Python distribution
        # Scope to the tagged version — never `twine check dist/*`.
        run: twine check "dist/ltcai-${{ steps.meta.outputs.version }}"*

      - name: Pack npm tarball
        run: npm pack

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          test -f out/extension.js
          vsce package --no-yarn -o "../dist/ltcai-${{ steps.meta.outputs.version }}.vsix"

      - name: Validate release artifacts (version-scoped, no dist/* glob)
        run: |
          python scripts/validate_release_artifacts.py \
            "${{ steps.meta.outputs.version }}" --require-vsix --require-tgz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # Explicit per-version paths only — no `dist/*` glob.
          path: |
            dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl
            dist/ltcai-${{ steps.meta.outputs.version }}.tar.gz
            dist/ltcai-${{ steps.meta.outputs.version }}.vsix
            ltcai-${{ steps.meta.outputs.version }}.tgz
