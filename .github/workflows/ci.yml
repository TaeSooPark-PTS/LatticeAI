name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    name: Frontend, extensions & docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: |
          npm ci
          (cd vscode-extension && npm ci)

      - name: Lint frontend, i18n, bundle & docs
        run: |
          npm run lint:visual
          npm run lint:frontend
          npm run typecheck
          node scripts/check_i18n_literals.mjs
          npm run check:i18n-namespaces
          npm run check:bundle
          npm run check:server-i18n
          node scripts/check_release_evidence_bound.mjs
          npm run check:max-file-lines
          npm run check:no-comments
          npm run docs:check-current
          npm run docs:check-links
          npm run docs:check-languages
          node scripts/check_ubuntu_runner_compat.mjs --diagnostic

      - name: CLI, browser and VS Code extension tests
        run: npm run test:cli && npm run test:browser-extension && npm run test:vscode-extension

      - name: Run frontend tests (100% coverage)
        # vitest.config.mts pins 100% thresholds on all four metrics.
        run: npm run test:frontend:coverage

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 3.14 is what the product is developed on daily; 3.11 is the floor;
      # macOS arm64 catches platform-specific path/subprocess/sqlite issues.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node (OpenAPI drift check leg only)
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.11" ]; then
            pip install -e ".[ann]" pytest pytest-asyncio httpx ruff "mypy>=1.14,<2"
            pip install --no-cache-dir --force-reinstall --no-deps hnswlib
            python -c "import hnswlib; print('hnswlib ok:', hnswlib.__file__)"
            npm ci
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.14" ]; then
            pip install -e "." pytest pytest-asyncio httpx "pytest-cov>=7,<8"
          else
            pip install -e "." pytest pytest-asyncio httpx
          fi

      - name: Generate & check OpenAPI sync
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          npm run frontend:openapi:check
          mkdir -p openapi-artifacts
          cp frontend/openapi.json frontend/src/api/openapi.ts openapi-artifacts/

      - name: Upload OpenAPI artifacts
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-generated
          path: openapi-artifacts/
          retention-days: 1

      - name: Lint and typecheck Python
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: npm run lint:python

      - name: Retrieval baseline budget check
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          python -c "import hnswlib"
          python scripts/bench_retrieval_baseline.py --check-budgets

      - name: Run unit tests
        if: matrix.python-version != '3.14' || matrix.os != 'ubuntu-latest'
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Coverage floor (>=90)
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        # 3.14 + ubuntu uses sys.monitoring for accurate line coverage (>=90).
        run: python -m pytest tests/ -q --cov --cov-report=term:skip-covered

      - name: Product readiness gate
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: python scripts/product_readiness.py

  integration:
    # One Door: builds `lattice-host`, boots it supervising the Python worker,
    # and runs isolated integration tests in a disposable tempdir.
    name: Integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Install dependencies
        run: pip install -e "." pytest pytest-asyncio httpx

      - name: Run isolated integration tests
        env:
          PYTHON: python
        run: npm run test:integration

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Extract package version
        id: meta
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check "dist/ltcai-${{ steps.meta.outputs.version }}"*

      - name: Installed-wheel smoke test (fresh venv, non-repo cwd)
        run: python scripts/wheel_smoke.py --wheel "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl"

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  rust-core:
    name: Rust (lint & core crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: rust-core

      - name: Install cargo-nextest (verified release action)
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest

      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test core crates (nextest + doctests)
        working-directory: rust
        run: |
          cargo nextest run --no-fail-fast -p lattice-core -p lattice-retrieval -p lattice-ingest -p lattice-jobs -p lattice-auth
          cargo test --doc -p lattice-core -p lattice-retrieval -p lattice-ingest -p lattice-jobs -p lattice-auth

  rust-runtime:
    name: Rust (agent, platform, chat & host)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: rust-runtime

      - name: Install cargo-nextest (verified release action)
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest

      - name: Test runtime crates (nextest + doctests)
        working-directory: rust
        run: |
          cargo nextest run --no-fail-fast -p lattice-agent -p lattice-platform -p lattice-chat -p lattice-host
          cargo test --doc -p lattice-agent -p lattice-platform -p lattice-chat -p lattice-host

  rust-windows:
    name: Rust (Windows workspace tests)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: rust-windows

      - name: Install cargo-nextest (verified release action)
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest

      - name: Test Rust workspace on Windows (nextest + doctests)
        working-directory: rust
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --doc --workspace

  tauri-check:
    name: Desktop shell (Tauri check & tests)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and Tauri build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust
            src-tauri
          key: tauri-check

      - name: Check & test src-tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml

  docker-smoke:
    name: Docker image build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build multi-stage Docker image & smoke-check lattice-host
        run: |
          docker build -t latticeai:ci-smoke .
          docker run --rm --entrypoint lattice-host latticeai:ci-smoke --version

  visual:
    name: Playwright visual smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chromium Ubuntu 24.04 / 26.04 (t64) shared libraries
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: l
        run: |
          LDCACHE="$(ldconfig -p 2>/dev/null || true)"
          MISSING=""
          for pair in \
            "libasound.so.2:libasound2t64" \
            "libatk-1.0.so.0:libatk1.0-0t64" \
            "libatk-bridge-2.0.so.0:libatk-bridge2.0-0t64" \
            "libcups.so.2:libcups2t64" \
            "libgtk-3.so.0:libgtk-3-0t64" \
            "libgbm.so.1:libgbm1" \
            "libnss3.so:libnss3" \
            "libxkbcommon.so.0:libxkbcommon0"; do
            SONAME="${pair%%:*}"
            PKG="${pair##*:}"
            if ! grep -q "${SONAME}" <<< "${LDCACHE}"; then
              MISSING="${MISSING} ${PKG}"
            fi
          done
          if [ -z "${MISSING}" ]; then
            echo "All Chromium shared libraries are already present on the runner; skipping apt-get."
            exit 0
          fi
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "2";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99fast-failover >/dev/null || true
          echo "Installing missing Chromium libraries:${MISSING}"
          sudo -E apt-get update -y || true
          sudo -E apt-get install -y --no-install-recommends ${MISSING} || {
            for pkg in ${MISSING}; do
              sudo -E apt-get install -y --no-install-recommends "${pkg}" || sudo -E apt-get install -y --no-install-recommends "${pkg%t64}" || true
            done
          }

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify Ubuntu 24.04 / 26.04 Chromium shared libraries
        run: node scripts/check_ubuntu_runner_compat.mjs --diagnostic --verify-chromium

      - name: Run visual smoke tests
        run: npm run test:visual

      - name: Upload visual failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-report
          path: |
            test-results/
            playwright-report/
