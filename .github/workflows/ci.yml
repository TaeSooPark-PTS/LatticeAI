name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -e "." pytest pytest-asyncio httpx ruff
          npm ci
          (cd vscode-extension && npm ci)

      - name: Syntax check (discover-based, auto-includes new modules)
        run: python scripts/check_python.py

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run docs:check-current
          npm run docs:check-links

      - name: Run tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Brain recall/KG quality eval
        run: python scripts/brain_quality_eval.py

      - name: Product readiness gate
        run: python scripts/product_readiness.py

  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e "." pytest pytest-asyncio httpx

      - name: Start server
        env:
          LATTICEAI_HOST: 127.0.0.1
          LATTICEAI_PORT: "8899"
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8899 > /tmp/ltcai-server.log 2>&1 &
          echo $! > /tmp/ltcai-server.pid

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ltcai-server.log
          exit 1

      - name: Run integration tests
        env:
          LTCAI_TEST_BASE_URL: http://127.0.0.1:8899
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/ltcai-server.log

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/ltcai-server.pid)"

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Extract package version
        id: meta
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check "dist/ltcai-${{ steps.meta.outputs.version }}"*

      - name: Installed-wheel smoke test (fresh venv, non-repo cwd)
        run: python scripts/wheel_smoke.py --wheel "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
