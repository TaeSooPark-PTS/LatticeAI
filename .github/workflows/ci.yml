name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 3.14 is what the product is developed on daily; without it here, the
      # maintainer's own environment was the one configuration CI never saw.
      # macOS is where the flagship path runs (Apple Silicon, MLX) and where
      # the .dmg is produced, and it had no runner at all through 10.1.x — the
      # desktop artifact was only ever built on one laptop.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.14"]
        include:
          # One macOS leg on the floor version: enough to catch platform-specific
          # breakage (path handling, subprocess, tempfile, sqlite build flags)
          # without tripling the matrix.
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -e "." pytest pytest-asyncio httpx ruff
          npm ci
          (cd vscode-extension && npm ci)

      - name: Generate OpenAPI (for drift fix artifact)
        run: |
          npm run frontend:openapi
          mkdir -p openapi-artifacts
          cp frontend/openapi.json frontend/src/api/openapi.ts openapi-artifacts/
        continue-on-error: true

      - name: Upload OpenAPI artifacts
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-generated
          path: openapi-artifacts/
          retention-days: 1

      - name: Syntax check (discover-based, auto-includes new modules)
        run: python scripts/check_python.py

      - name: Lint and typecheck
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          npm run lint
          npm run typecheck
          npm run docs:check-current
          npm run docs:check-links

      - name: Lint (Python only, other matrix legs)
        if: matrix.python-version != '3.11' || matrix.os != 'ubuntu-latest'
        run: npm run lint:python

      - name: Run tests
        run: |
          npm run test:frontend
          python -m pytest tests/unit/ -v --tb=short

      - name: Coverage floor
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        # Measurable for the first time in 10.2.0: the connection leak fixed in
        # this release exhausted file descriptors under a tracer, so any
        # coverage run failed ~400 tests and the real number was unknown.
        run: |
          pip install "pytest-cov>=7,<8"
          python -m pytest tests/ -q --cov --cov-report=term:skip-covered

      - name: Brain recall/KG quality eval
        run: python scripts/brain_quality_eval.py

      - name: Agent loop evaluation harness
        run: python scripts/agent_eval.py

      - name: Product readiness gate
        run: python scripts/product_readiness.py

  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -e "." pytest pytest-asyncio httpx

      - name: Run isolated integration tests
        env:
          PYTHON: python
        run: npm run test:integration

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Extract package version
        id: meta
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check "dist/ltcai-${{ steps.meta.outputs.version }}"*

      - name: Installed-wheel smoke test (fresh venv, non-repo cwd)
        run: python scripts/wheel_smoke.py --wheel "dist/ltcai-${{ steps.meta.outputs.version }}-py3-none-any.whl"

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
