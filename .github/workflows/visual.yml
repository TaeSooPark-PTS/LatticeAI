name: Visual Smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual:
    name: Playwright visual smoke
    # Playwright's Chromium installer does not yet support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure APT mirror timeouts
        run: |
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "2";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99fast-failover >/dev/null || true

      - name: Install Ubuntu 24.04 / 26.04 (t64) system libraries
        # Ubuntu 24.04 and upcoming Ubuntu 26.04 (`ubuntu-latest` / `ubuntu-26.04`)
        # transitioned 32-bit time_t packages to `t64` suffixes. Batch the fast
        # path into a single apt transaction and fall back per-library if needed.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: l
        run: |
          sudo -E apt-get update -y || true
          sudo -E apt-get install -y --no-install-recommends \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 \
            libgbm1 libnss3 libxkbcommon0 libayatana-appindicator3-1 libwebkit2gtk-4.1-0 || {
            sudo -E apt-get install -y --no-install-recommends libasound2t64 || sudo -E apt-get install -y --no-install-recommends libasound2 || true
            sudo -E apt-get install -y --no-install-recommends libatk1.0-0t64 || sudo -E apt-get install -y --no-install-recommends libatk1.0-0 || true
            sudo -E apt-get install -y --no-install-recommends libatk-bridge2.0-0t64 || sudo -E apt-get install -y --no-install-recommends libatk-bridge2.0-0 || true
            sudo -E apt-get install -y --no-install-recommends libcups2t64 || sudo -E apt-get install -y --no-install-recommends libcups2 || true
            sudo -E apt-get install -y --no-install-recommends libgtk-3-0t64 || sudo -E apt-get install -y --no-install-recommends libgtk-3-0 || true
            sudo -E apt-get install -y --no-install-recommends libgbm1 libnss3 libxkbcommon0 libayatana-appindicator3-1 || true
            sudo -E apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 || sudo -E apt-get install -y --no-install-recommends webkit2gtk-4.1 || true
          }

      - name: Install Chromium
        # System libraries were already installed in the batched t64 step above;
        # skip `--with-deps` to avoid a second redundant apt-get transaction.
        run: npx playwright install chromium

      - name: Verify Ubuntu 24.04 / 26.04 Chromium shared libraries
        run: node scripts/check_ubuntu_runner_compat.mjs --diagnostic --verify-chromium

      - name: Run visual smoke tests
        run: npm run test:visual

      - name: Upload visual failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-report
          path: |
            test-results/
            playwright-report/
