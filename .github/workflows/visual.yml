name: Visual Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual:
    name: Playwright visual smoke
    # Playwright's Chromium installer does not yet support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure DNS and APT
        run: |
          sudo sed -i '1s/^/nameserver 8.8.8.8\nnameserver 1.1.1.1\n/' /etc/resolv.conf || true
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 || true
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99retries || true

      - name: Install Ubuntu 24.04 / 26.04 (t64) system libraries
        # Ubuntu 24.04 and upcoming Ubuntu 26.04 (`ubuntu-latest` / `ubuntu-26.04`)
        # transitioned 32-bit time_t packages to `t64` suffixes. Install with
        # explicit fallback chains before Playwright's `--with-deps` runs.
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2 || true
          sudo apt-get install -y --no-install-recommends libatk1.0-0t64 || sudo apt-get install -y --no-install-recommends libatk1.0-0 || true
          sudo apt-get install -y --no-install-recommends libatk-bridge2.0-0t64 || sudo apt-get install -y --no-install-recommends libatk-bridge2.0-0 || true
          sudo apt-get install -y --no-install-recommends libcups2t64 || sudo apt-get install -y --no-install-recommends libcups2 || true
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 || sudo apt-get install -y --no-install-recommends libgtk-3-0 || true
          sudo apt-get install -y --no-install-recommends libgbm1 libnss3 libxkbcommon0 libayatana-appindicator3-1 || true
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 || sudo apt-get install -y --no-install-recommends webkit2gtk-4.1 || true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Verify Ubuntu 24.04 / 26.04 Chromium shared libraries
        run: node scripts/check_ubuntu_runner_compat.mjs --diagnostic --verify-chromium

      - name: Run visual smoke tests
        run: npm run test:visual

      - name: Upload visual failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-report
          path: |
            test-results/
            playwright-report/
