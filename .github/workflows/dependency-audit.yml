name: Dependency Audit

# Supply-chain audit for Python (pip-audit) and npm dependencies, plus a
# CycloneDX SBOM for each ecosystem.
#
# Enforcement posture (conservative, CI-green-first):
#   * push / pull_request  -> audits run but DO NOT block the merge
#     (continue-on-error), so a newly-disclosed CVE in a transitive dep can
#     never redden an unrelated PR. Findings still surface in the job summary
#     and uploaded reports.
#   * schedule / workflow_dispatch -> audits are STRICT and fail on findings
#     (pip-audit: any known vuln; npm: high+), so the weekly run is the loud
#     channel for triaging supply-chain drift.
#
# To promote this to a required, blocking check on PRs, remove the
# continue-on-error expressions below. See docs/CI_AND_RELEASE_GATES.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# GitHub is migrating JS actions to Node.js 24 (Node 20 removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (non-blocking on PR/push, strict on schedule/dispatch)
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          pip-audit -r requirements.txt --strict --desc on \
            --format markdown --output pip-audit-report.md
          cat pip-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Python SBOM (CycloneDX)
        if: always()
        continue-on-error: true
        run: pip-audit -r requirements.txt -f cyclonedx-json -o sbom-python.json

      - name: Upload Python audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dependency-audit
          path: |
            pip-audit-report.md
            sbom-python.json
          if-no-files-found: ignore

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+; non-blocking on PR/push, strict on schedule/dispatch)
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          npm audit --audit-level=high | tee npm-audit-report.txt
          {
            echo '### npm audit (audit-level=high)';
            echo '```';
            cat npm-audit-report.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate npm SBOM (CycloneDX)
        if: always()
        continue-on-error: true
        run: npm sbom --sbom-format cyclonedx > sbom-npm.json

      - name: Upload npm audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dependency-audit
          path: |
            npm-audit-report.txt
            sbom-npm.json
          if-no-files-found: ignore
