[package]
name = "lattice-ai-desktop"
version = "11.4.0"
description = "Lattice AI Digital Brain desktop shell"
authors = ["TaeSoo Park"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = [] }
plist = "=1.7.0"
time = "=0.3.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The supervisor (command resolution, spawn, HTTP health gate, backoff restart,
# graceful stop) shared with the `lattice-host` binary. A path dependency, not a
# workspace member: `rust/` must stay buildable on a CI runner with no tauri
# system libraries, so this crate deliberately sits outside that workspace.
lattice-host = { path = "../rust/lattice-host" }
