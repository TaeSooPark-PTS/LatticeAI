[package]
name = "lattice-ai-desktop"
version = "7.2.0"
description = "Lattice AI Digital Brain desktop shell"
authors = ["TaeSoo Park"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = [] }
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-utils = "=2.0.0"
plist = "=1.7.0"
time = "=0.3.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
