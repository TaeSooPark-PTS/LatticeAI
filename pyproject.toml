[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltcai"
version = "10.6.2"
description = "Lattice AI — local-first Digital Brain that keeps your knowledge durable across any AI model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "TaeSoo Park" }
]
keywords = ["ai", "llm", "mlx", "mcp", "rag", "vscode"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Bounded constraints: lower bounds from the verified dev environment,
# upper bounds at the next major (next minor for fastapi/uvicorn pre-1.0).
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "openai>=1.30,<3",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=0.6.23,<2",
  "python-multipart>=0.0.9,<0.1",
  "keyring>=24,<26",
  "authlib>=1.3,<2",
  "cryptography>=42,<49",
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=4.30,<6",
  "watchdog>=4,<7",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ann = ["sqlite-vec>=0.1,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
local = ["mlx-vlm>=0.6.3", "mlx-lm"]
voice = ["openai-whisper", "SpeechRecognition", "pydub"]
all = ["mlx-vlm>=0.6.3", "mlx-lm", "openai-whisper", "SpeechRecognition", "pydub", "sqlite-vec>=0.1,<1", "psycopg[binary]>=3.2,<4"]
# Development-only checkers. Coverage became measurable in 10.2.0: before the
# connection-leak fix, running under a tracer exhausted file descriptors and
# ~400 tests failed, so the real number was unknown.
dev = ["pytest-cov>=7,<8", "mypy>=1.14,<2"]

[project.scripts]
LTCAI = "latticeai.cli.entrypoint:main"

[project.urls]
Homepage = "https://github.com/TaeSooPark-PTS/LatticeAI"
Repository = "https://github.com/TaeSooPark-PTS/LatticeAI"
Documentation = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/README.md"
Issues = "https://github.com/TaeSooPark-PTS/LatticeAI/issues"
Changelog = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
py-modules = [
  "server",
]
packages = ["lattice_brain", "lattice_brain.graph", "lattice_brain.runtime", "lattice_brain.storage", "latticeai", "latticeai.core", "latticeai.api", "latticeai.cli", "latticeai.integrations", "latticeai.models", "latticeai.runtime", "latticeai.services", "latticeai.setup", "latticeai.tools"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "static/*.ico",
  "static/manifest.json",
  "static/sw.js",
  "static/icons/*.png",
  "static/css/*.css",
  "static/app/**/*.html",
  "static/app/**/*.css",
  "static/app/**/*.js",
  "static/app/**/*.json",
  "static/vendor/**/*.css",
  "static/vendor/**/*.js",
  "static/vendor/**/*.woff2",
  "docs/*.md",
  "skills/**/*.md",
  "plugins/**/*.json",
  "plugins/**/*.md",
]

[tool.setuptools.data-files]
"static" = ["static/favicon.ico", "static/manifest.json", "static/sw.js"]
"static/css" = ["static/css/*.css"]
"static/app" = ["static/app/index.html", "static/app/asset-manifest.json", "static/app/theme-boot.js"]
# Explicit asset extensions only — never package *.js.map sourcemaps (payload + source leak).
"static/app/assets" = ["static/app/assets/*.js", "static/app/assets/*.css", "static/app/assets/*.woff2", "static/app/assets/*.woff", "static/app/assets/*.ttf", "static/app/assets/*.png", "static/app/assets/*.svg", "static/app/assets/*.webp"]
"static/icons" = ["static/icons/icon-192.png", "static/icons/icon-512.png", "static/icons/apple-touch-icon.png", "static/icons/favicon-32.png"]
"static/vendor" = ["static/vendor/chart.umd.min.js", "static/vendor/marked.min.js"]
"static/vendor/fonts" = ["static/vendor/fonts/inter.css", "static/vendor/fonts/inter-latin-300-normal.woff2", "static/vendor/fonts/inter-latin-400-normal.woff2", "static/vendor/fonts/inter-latin-500-normal.woff2", "static/vendor/fonts/inter-latin-600-normal.woff2", "static/vendor/fonts/inter-latin-700-normal.woff2", "static/vendor/fonts/inter-latin-800-normal.woff2"]
"static/vendor/icons" = ["static/vendor/icons/tabler-icons.min.css", "static/vendor/icons/tabler-icons.woff2"]
"plugins" = ["plugins/README.md"]
"plugins/hello-world" = ["plugins/hello-world/plugin.json"]
"plugins/hello-world/skills/hello_skill" = ["plugins/hello-world/skills/hello_skill/SKILL.md"]
"plugins/git-insights" = ["plugins/git-insights/plugin.json"]

[tool.ruff]
# v4 lint baseline: pyflakes + pycodestyle errors over the whole tree.
# Legacy monoliths carry scoped ignores rather than weakening global rules.
extend-exclude = ["ltcai-0.3.1", "dist-smoke", "agent_workspace", "venv", "output", "outputs"]

[tool.ruff.lint]
# 10.2.0 widened this from pyflakes-only. The net that existed through 10.1.x
# could not have caught the connection leak that made coverage unmeasurable,
# so the additions are chosen for the bug classes that actually bit:
#   B    bugbear      — loop-variable capture, un-chained raises, bare zip
#   S   flake8-bandit — subprocess, SQL string building, silent except
#   I    isort        — deterministic import order
#   SIM  simplify     — redundant branches that hide intent
#   RET  return       — inconsistent returns
#   C901 complexity   — a ceiling, ratcheted down over time
#
# UP (pyupgrade) is deliberately absent: 5,046 violations, almost all
# `Optional[X]` → `X | None`, and rewriting annotation syntax across the tree
# is a change to every file for no behavioural gain while 3.11 is the floor.
select = ["E4", "E7", "E9", "F", "B", "S", "I", "SIM", "RET", "C901"]
ignore = [
  # B904 (raise ... from err): 47 sites, all in handlers that deliberately
  # translate a low-level failure into a product-level message. Chaining would
  # leak internals into user-facing detail strings. Revisit if those messages
  # ever stop being user-facing.
  "B904",
  # S310: every urlopen in this tree is a user-initiated fetch of a URL the
  # user typed, already scheme-checked at the call site.
  "S310",
  # S104: binding 0.0.0.0 is refused at runtime unless the user explicitly
  # opts in (see latticeai/core/security.py); the literal itself is not the gate.
  "S104",
  # SIM105 (contextlib.suppress): would re-hide the exceptions 10.2.0 just
  # made visible via quiet(). The explicit handler is the point.
  "SIM105",
  # Style-only, no bug class behind them. The point of widening the rule set
  # was the failure modes that actually bit this codebase (loop capture, silent
  # handlers, truncating zips); reformatting nested ifs is not that, and doing
  # it in the same release would bury those diffs in noise.
  "SIM102", "SIM112", "SIM117", "RET504",
]

[tool.ruff.lint.mccabe]
# 30 is a real ceiling for ordinary code: only three functions in the tree
# exceed it, and each is named in per-file-ignores with a reason. Router
# factories are exempt below — their "complexity" is N sibling route handlers
# defined in one closure, an idiom of this codebase rather than tangled logic.
# Lower this as the exempted functions come down.
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
# Deliberate re-export hub: the tool registry's public surface.
"latticeai/tools/__init__.py" = ["F401", "F403", "F405"]

# The one remaining legacy single-file monolith predating the lint baseline.
"latticeai/setup/auto_setup.py" = ["E702", "S110", "S603", "S604", "S607", "SIM"]

# Tests: `assert` is the point, fixtures hold fake credentials and temp paths,
# and lambdas stand in for tiny fakes. None of these are findings here.
"tests/**/*.py" = [
  "E402", "E731", "B007", "B011", "B017", "B023", "B905",
  "S101", "S105", "S106", "S108", "S110", "S306", "S311", "S324", "S603",
  "S604", "S607", "S608", "SIM",
]

# Developer tools, not product paths: a failed probe *is* the measurement.
"scripts/**/*.py" = [
  "E402", "S101", "S110", "S603", "S604", "S607", "S608", "SIM", "B007",
]

# Router factories: one closure holding N sibling route handlers. mccabe counts
# every handler's branches as a single function's complexity, which measures the
# wrong thing. The surfaces here are operator/admin tools behind the admin gate.
"latticeai/api/*.py" = ["C901", "E402", "SIM", "B008", "S105", "S108", "S603", "S604", "S607"]

# Named exceptions above the complexity ceiling, each with a standing reason:
#   app_factory._build — the composition root, being decomposed incrementally
#   hybrid_search      — one ranking algorithm; splitting it across files would
#                        scatter the pipeline without making it clearer
"latticeai/app_factory.py" = ["C901", "E402", "SIM"]
"lattice_brain/graph/retrieval.py" = ["C901", "SIM", "B007", "B905"]
"latticeai/services/local_knowledge.py" = ["C901", "SIM"]

# Process launchers. Every command is a fixed program plus validated arguments,
# recorded through latticeai/services/process_audit.py.
"latticeai/setup/*.py" = ["S404", "S603", "S604", "S607", "SIM", "B007"]
"latticeai/cli/*.py" = ["E402", "S603", "S604", "S607", "SIM"]
"latticeai/tools/*.py" = ["S404", "S603", "S607", "SIM", "B007"]
"latticeai/core/tool_registry.py" = ["S603", "S604", "S606", "S607", "SIM", "B007"]
"latticeai/core/mcp_registry.py" = ["S603", "S607", "SIM"]
"latticeai/services/model_engines.py" = ["S603", "S604", "S607", "SIM"]
"latticeai/services/model_loading.py" = ["S603", "S607", "SIM"]
"latticeai/services/model_runtime.py" = ["S603", "S607", "SIM", "B007"]
"latticeai/services/tool_dispatch.py" = ["S603", "S604", "S607", "SIM"]
"lattice_brain/runtime/hooks.py" = ["S603", "S607", "SIM"]

# SQL built with interpolated *table* names chosen from a fixed internal set
# (legacy tables vs the v2 reconstruction views). Values are always bound.
"lattice_brain/graph/*.py" = ["S608", "SIM", "B007", "B905", "E402"]
"lattice_brain/conversations.py" = ["S608", "SIM"]
"lattice_brain/storage/*.py" = ["S608", "SIM"]
"latticeai/core/workspace_os.py" = ["S608", "SIM"]

# Literal classification tables; flagged for the words they contain.
"lattice_brain/graph/_kg_constants.py" = ["S105", "S108"]

# Remaining reviewed surfaces.
"latticeai/core/*.py" = ["SIM", "B008", "S311", "S324"]
"latticeai/services/*.py" = ["SIM", "B008", "S306"]
"latticeai/models/*.py" = ["E402", "SIM"]
"latticeai/runtime/*.py" = ["E402", "SIM"]
"latticeai/integrations/*.py" = ["SIM", "B007"]
"lattice_brain/*.py" = ["SIM", "B007", "B905"]
"lattice_brain/runtime/*.py" = ["SIM", "B007"]

[tool.mypy]
# Gradual adoption, ratcheted. 10.2.0 started with 13 hand-picked modules;
# 10.3.0 measured the whole tree one file at a time and adopted every module
# that already type-checks — 193 of 270. The rest are listed in
# docs/MYPY_BACKLOG.md with what each needs, so the boundary is a fact rather
# than a vague "we'll get to it".
#
# `follow_imports = silent` keeps analysis inside the adopted set: imported
# modules resolve for types but their own errors stay quiet, so adding a file
# here is a decision to fix that file, not its dependencies.
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
