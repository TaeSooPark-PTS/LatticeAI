[tool.coverage.run]
# Product code only. A first attempt used `*/tests/*`, which does not match the
# repo-relative `tests/...` paths coverage records — so the suite counted
# itself, and since test files run ~100% by construction that inflated the
# figure by ten points. Measure what ships.
# Branch measurement is off: the gate is line coverage only.
source = ["latticeai", "lattice_brain"]
omit = ["tests/*", "scripts/*", "*/__main__.py", "*/conftest.py"]

[tool.coverage.report]
# Line-coverage floor at 90. Branch arcs are not gated. The only exclusions
# are reasoned `pragma: no cover` lines plus the generic patterns below.
fail_under = 90
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
