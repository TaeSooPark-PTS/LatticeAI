[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltcai"
version = "6.3.0"
description = "Lattice AI — local-first Digital Brain that keeps your knowledge durable across any AI model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "TaeSoo Park" }
]
keywords = ["ai", "llm", "mlx", "mcp", "rag", "vscode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Bounded constraints: lower bounds from the verified dev environment,
# upper bounds at the next major (next minor for fastapi/uvicorn pre-1.0).
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "openai>=1.30,<3",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=0.6.23,<2",
  "python-multipart>=0.0.9,<0.1",
  "keyring>=24,<26",
  "authlib>=1.3,<2",
  "cryptography>=42,<49",
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=4.30,<6",
  "watchdog>=4,<7",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ann = ["sqlite-vec>=0.1,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
local = ["mlx-vlm>=0.6.3", "mlx-lm"]
voice = ["openai-whisper", "SpeechRecognition", "pydub"]
all = ["mlx-vlm>=0.6.3", "mlx-lm", "openai-whisper", "SpeechRecognition", "pydub", "sqlite-vec>=0.1,<1", "psycopg[binary]>=3.2,<4"]

[project.scripts]
LTCAI = "ltcai_cli:main"

[project.urls]
Homepage = "https://github.com/TaeSooPark-PTS/LatticeAI"
Repository = "https://github.com/TaeSooPark-PTS/LatticeAI"
Documentation = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/README.md"
Issues = "https://github.com/TaeSooPark-PTS/LatticeAI/issues"
Changelog = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
py-modules = [
  "ltcai_cli",
  "auto_setup",
  "setup_wizard",
  "server",
  "mcp_registry",
  "kg_schema",
  "knowledge_graph",
  "knowledge_graph_api",
  "local_knowledge_api",
  "llm_router",
  "p_reinforce",
  "telegram_bot",
]
packages = ["lattice_brain", "lattice_brain.graph", "lattice_brain.runtime", "lattice_brain.storage", "latticeai", "latticeai.core", "latticeai.api", "latticeai.brain", "latticeai.cli", "latticeai.integrations", "latticeai.models", "latticeai.runtime", "latticeai.services", "tools"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "static/*.ico",
  "static/manifest.json",
  "static/sw.js",
  "static/icons/*.png",
  "static/css/*.css",
  "static/app/**/*.html",
  "static/app/**/*.css",
  "static/app/**/*.js",
  "static/app/**/*.json",
  "static/app/**/*.map",
  "static/vendor/**/*.css",
  "static/vendor/**/*.js",
  "static/vendor/**/*.woff2",
  "docs/*.md",
  "skills/**/*.md",
  "plugins/**/*.json",
  "plugins/**/*.md",
]

[tool.setuptools.data-files]
"static" = ["static/favicon.ico", "static/manifest.json", "static/sw.js"]
"static/css" = ["static/css/*.css"]
"static/app" = ["static/app/index.html", "static/app/asset-manifest.json"]
"static/app/assets" = ["static/app/assets/*"]
"static/icons" = ["static/icons/icon-192.png", "static/icons/icon-512.png", "static/icons/apple-touch-icon.png", "static/icons/favicon-32.png"]
"static/vendor" = ["static/vendor/chart.umd.min.js", "static/vendor/marked.min.js"]
"static/vendor/fonts" = ["static/vendor/fonts/inter.css", "static/vendor/fonts/inter-latin-300-normal.woff2", "static/vendor/fonts/inter-latin-400-normal.woff2", "static/vendor/fonts/inter-latin-500-normal.woff2", "static/vendor/fonts/inter-latin-600-normal.woff2", "static/vendor/fonts/inter-latin-700-normal.woff2", "static/vendor/fonts/inter-latin-800-normal.woff2"]
"static/vendor/icons" = ["static/vendor/icons/tabler-icons.min.css", "static/vendor/icons/tabler-icons.woff2"]
"plugins" = ["plugins/README.md"]
"plugins/hello-world" = ["plugins/hello-world/plugin.json"]
"plugins/hello-world/skills/hello_skill" = ["plugins/hello-world/skills/hello_skill/SKILL.md"]
"plugins/git-insights" = ["plugins/git-insights/plugin.json"]

[tool.ruff]
# v4 lint baseline: pyflakes + pycodestyle errors over the whole tree.
# Legacy monoliths carry scoped ignores rather than weakening global rules.
extend-exclude = ["ltcai-0.3.1", "dist-smoke", "agent_workspace", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Deliberate re-export hub: the tool registry's public surface.
"tools/__init__.py" = ["F401", "F403", "F405"]
# Deprecation shims re-export moved modules for the compatibility window.
"llm_router.py" = ["F401", "F403", "F405"]
"mcp_registry.py" = ["F401", "F403", "F405"]
"knowledge_graph_api.py" = ["F401", "F403", "F405"]
# Legacy single-file modules predating the lint baseline (decomposed/retired
# across v4 tracks); style-only rules are scoped off until then.
"auto_setup.py" = ["E701", "E702", "E731", "E741", "F841"]
"setup_wizard.py" = ["E701", "E702", "E731", "F841"]
"latticeai/integrations/telegram_bot.py" = ["E701", "E702", "E731", "F841"]
"knowledge_graph.py" = ["E701", "E702", "E731", "F841"]
"latticeai/services/p_reinforce.py" = ["E701", "E702", "E731", "F841"]
"latticeai/cli/entrypoint.py" = ["E701", "E702", "E731", "F841"]
# Tests may use lambdas for tiny local fakes.
"tests/**/*.py" = ["E731"]
