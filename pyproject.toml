[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltcai"
version = "0.1.9"
description = "Lattice AI local MLX/cloud LLM workspace server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "httpx",
  "pillow",
  "openai",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "python-multipart",
  "keyring",
  "authlib",
  "pdfplumber",
  "pymupdf",
]

[project.optional-dependencies]
local = ["mlx-lm", "mlx-vlm"]
voice = ["openai-whisper", "SpeechRecognition", "pydub"]
all = ["mlx-lm", "mlx-vlm", "openai-whisper", "SpeechRecognition", "pydub"]

[project.scripts]
LTCAI = "ltcai_cli:main"

[project.urls]
Homepage = "https://github.com/TaeSooPark-PTS/LatticeAI"
Repository = "https://github.com/TaeSooPark-PTS/LatticeAI"

[tool.setuptools]
py-modules = [
  "ltcai_cli",
  "server",
  "knowledge_graph",
  "llm_router",
  "p_reinforce",
  "telegram_bot",
  "tools",
  "codex_telegram_bot",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "static/*.html",
  "static/manifest.json",
  "static/sw.js",
  "static/icons/*.png",
  "docs/*.md",
  "skills/**/*.md",
]

[tool.setuptools.data-files]
"static" = ["static/account.html", "static/chat.html", "static/admin.html", "static/graph.html", "static/manifest.json", "static/sw.js"]
"static/icons" = ["static/icons/icon-192.png", "static/icons/icon-512.png", "static/icons/apple-touch-icon.png", "static/icons/favicon-32.png"]
