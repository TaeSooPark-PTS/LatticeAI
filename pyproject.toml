[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltcai"
version = "2.2.1"
description = "Lattice AI Workspace OS for local-first graph, memory, agent, workflow, and skill operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "TaeSoo Park" }
]
keywords = ["ai", "llm", "mlx", "mcp", "rag", "vscode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "httpx",
  "pillow",
  "openai",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "python-multipart",
  "keyring",
  "authlib",
  "pdfplumber",
  "pypdfium2",
  "watchdog",
]

[project.optional-dependencies]
local = ["mlx-vlm"]
voice = ["openai-whisper", "SpeechRecognition", "pydub"]
all = ["mlx-vlm", "openai-whisper", "SpeechRecognition", "pydub"]

[project.scripts]
LTCAI = "ltcai_cli:main"

[project.urls]
Homepage = "https://github.com/TaeSooPark-PTS/LatticeAI"
Repository = "https://github.com/TaeSooPark-PTS/LatticeAI"
Documentation = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/README.md"
Issues = "https://github.com/TaeSooPark-PTS/LatticeAI/issues"
Changelog = "https://github.com/TaeSooPark-PTS/LatticeAI/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
py-modules = [
  "ltcai_cli",
  "auto_setup",
  "server",
  "mcp_registry",
  "kg_schema",
  "knowledge_graph",
  "knowledge_graph_api",
  "local_knowledge_api",
  "llm_router",
  "p_reinforce",
  "telegram_bot",
  "tools",
  "codex_telegram_bot",
]
packages = ["latticeai", "latticeai.core", "latticeai.api", "latticeai.services"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "static/*.html",
  "static/*.css",
  "static/scripts/*.js",
  "static/manifest.json",
  "static/sw.js",
  "static/icons/*.png",
  "static/css/*.css",
  "docs/*.md",
  "skills/**/*.md",
  "plugins/**/*.json",
  "plugins/**/*.md",
]

[tool.setuptools.data-files]
"static" = ["static/account.html", "static/chat.html", "static/admin.html", "static/graph.html", "static/workspace.html", "static/plugins.html", "static/workflows.html", "static/agents.html", "static/activity.html", "static/manifest.json", "static/sw.js", "static/lattice-reference.css", "static/workspace.css", "static/platform.css"]
"static/scripts" = ["static/scripts/account.js", "static/scripts/admin.js", "static/scripts/chat.js", "static/scripts/graph.js", "static/scripts/workspace.js", "static/scripts/platform.js", "static/scripts/ux.js"]
"static/css" = ["static/css/tokens.css", "static/css/responsive.css"]
"static/icons" = ["static/icons/icon-192.png", "static/icons/icon-512.png", "static/icons/apple-touch-icon.png", "static/icons/favicon-32.png"]
"plugins" = ["plugins/README.md"]
"plugins/hello-world" = ["plugins/hello-world/plugin.json"]
"plugins/hello-world/skills/hello_skill" = ["plugins/hello-world/skills/hello_skill/SKILL.md"]
"plugins/git-insights" = ["plugins/git-insights/plugin.json"]
